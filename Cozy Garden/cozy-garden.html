<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  [hidden] { display: none !important; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  img { max-width: 100%; }
</style>
<title>Cozy Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  /* Layout: a clay toy diorama. The plot is a tilted grass slab with soil mounds and upright clay crops; every control is a puffy pressable clay piece. Dusk diorama in dark mode. */
  :root {
    --sky-1: #9fd4ef; --sky-2: #cdeaf2; --sky-3: #e6f3d8;
    --card: #fbf6ef; --panel: #ffffff; --ink: #463a5a; --ink-soft: #7d7190;
    --grass: #8fcf6e; --grass-side: #5f9f4a; --soil: #a86d45; --soil-wet: #7a4a2e;
    --sage: #7cc48f; --butter: #ffd36b; --coral: #ff8f7a; --lilac: #b39cf2; --aqua: #6fcdc3; --gold: #f5c542; --water: #5cc0f0;
    --on-color: #3b2f4d; --shadow: rgba(70,50,100,.2); --veil: rgba(40,30,60,.45); --badge: #ff6b6b; --cloud: #ffffff;
    --tilt: 26deg;
    --font-display: "Baloo 2", "Trebuchet MS", sans-serif;
    --font-body: "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --sky-1: #161b38; --sky-2: #252c52; --sky-3: #33405a;
    --card: #2c2940; --panel: #37334f; --ink: #efe9ff; --ink-soft: #b7add2;
    --grass: #5b9a4f; --grass-side: #3b6834; --soil: #87553a; --soil-wet: #5e3a25;
    --sage: #66b07b; --butter: #e9be55; --coral: #ea7c6c; --lilac: #9d86e0; --aqua: #4fb5aa; --gold: #e6b83c; --water: #4aa8d8;
    --on-color: #241d33; --shadow: rgba(0,0,0,.42); --veil: rgba(0,0,0,.6); --badge: #ff7a7a; --cloud: #8d93bd;
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --sky-1: #161b38; --sky-2: #252c52; --sky-3: #33405a;
    --card: #2c2940; --panel: #37334f; --ink: #efe9ff; --ink-soft: #b7add2;
    --grass: #5b9a4f; --grass-side: #3b6834; --soil: #87553a; --soil-wet: #5e3a25;
    --sage: #66b07b; --butter: #e9be55; --coral: #ea7c6c; --lilac: #9d86e0; --aqua: #4fb5aa; --gold: #e6b83c; --water: #4aa8d8;
    --on-color: #241d33; --shadow: rgba(0,0,0,.42); --veil: rgba(0,0,0,.6); --badge: #ff7a7a; --cloud: #8d93bd;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--sky-2); }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding-block: 14px 30px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--ink);
    background: linear-gradient(var(--sky-1) 0%, var(--sky-2) 50%, var(--sky-3) 100%) fixed;
    overflow-x: hidden;
  }
  button { font-family: inherit; color: inherit; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }

  /* clay pieces: a light top lip, a darker underside, and a short slab shadow give each one thickness */
  .clay {
    --c: var(--panel);
    background: radial-gradient(120% 90% at 30% 15%, color-mix(in srgb, var(--c) 82%, white), var(--c) 55%, color-mix(in srgb, var(--c) 90%, black));
    box-shadow: inset 0 2px 1px rgba(255,255,255,.55), inset 0 -3px 2px color-mix(in srgb, var(--c) 70%, black 30%),
      0 4px 0 color-mix(in srgb, var(--c) 62%, black), 0 8px 14px var(--shadow);
    border: 0; border-radius: 16px;
  }
  button.clay { cursor: pointer; transition: transform .08s, box-shadow .08s, filter .15s; }
  button.clay:hover:not(:disabled) { filter: brightness(1.05); }
  button.clay:active:not(:disabled) { transform: translateY(3px);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.5), inset 0 -2px 2px color-mix(in srgb, var(--c) 70%, black 30%), 0 1px 0 color-mix(in srgb, var(--c) 62%, black), 0 3px 6px var(--shadow); }
  button.clay:disabled { cursor: default; filter: grayscale(.65) opacity(.6); }

  .cloud { position: fixed; top: 7%; width: 120px; height: 38px; border-radius: 40px; background: var(--cloud); opacity: .85;
    box-shadow: 26px -18px 0 4px var(--cloud), 60px -6px 0 2px var(--cloud), inset 0 -6px 0 rgba(120,140,180,.2);
    animation: drift 90s linear infinite; pointer-events: none; }
  .cloud.c2 { top: 18%; transform: scale(.7); animation-duration: 130s; animation-delay: -60s; opacity: .7; }
  @keyframes drift { from { left: -180px; } to { left: 105%; } }

  #game { --c: var(--card); width: 100%; max-width: 460px; padding: 16px 14px 18px; border-radius: 30px; position: relative; z-index: 1; }
  h1 { margin: 0; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.1; letter-spacing: .5px;
    color: var(--sage); text-shadow: 0 2px 0 color-mix(in srgb, var(--sage) 55%, black), 0 5px 8px var(--shadow); }
  .sub { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 4px 0 12px; min-height: 36px; line-height: 1.4; }
  .top { display: flex; align-items: center; margin-bottom: 12px; gap: 7px; }
  .pill { --c: var(--panel); display: flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 11px 3px 4px; font-weight: 800; font-size: 15px;
    font-variant-numeric: tabular-nums; white-space: nowrap; transition: transform .15s; }
  .pill .spr { width: 26px; height: 26px; }
  .pill.grow { flex: 1; min-width: 0; overflow: hidden; }
  .pill.bump { transform: scale(1.1); }
  .iconbtn { --c: var(--panel); width: 38px; height: 34px; border-radius: 999px; font-size: 15px; padding: 0; }
  #sel { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 800; margin: 2px 0 6px; min-height: 22px; color: var(--ink-soft); }
  #sel.placing { color: var(--aqua); }
  #lvl { margin-bottom: 8px; }
  #lvl .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 800; margin-bottom: 4px; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  #lvl .row span:first-child { font-family: var(--font-display); font-size: 18px; color: var(--ink); }
  #lvl .track { --c: var(--panel); height: 16px; border-radius: 999px; padding: 3px; box-shadow: inset 0 2px 4px var(--shadow), 0 2px 0 rgba(255,255,255,.4); background: color-mix(in srgb, var(--panel) 80%, var(--ink) 8%); }
  #lvl .fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(var(--butter), color-mix(in srgb, var(--butter) 70%, var(--coral)));
    box-shadow: inset 0 2px 0 rgba(255,255,255,.55); transition: width .3s; }
  #nextUnlock { margin-top: 5px; font-size: 11px; color: var(--ink-soft); text-align: center; min-height: 14px; }

  /* the diorama */
  #stage { perspective: 1000px; perspective-origin: 50% -20%; padding: 26px 2px 0; margin-bottom: 18px; }
  #plot { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 7px; padding: 12px; position: relative;
    transform: rotateX(var(--tilt)); transform-origin: 50% 100%; transform-style: preserve-3d; border-radius: 24px;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.18) 0 3px, transparent 4px) 0 0 / 34px 34px,
      radial-gradient(circle at 70% 70%, rgba(0,0,0,.08) 0 3px, transparent 4px) 0 0 / 28px 28px,
      radial-gradient(120% 90% at 30% 10%, color-mix(in srgb, var(--grass) 80%, white), var(--grass) 60%);
    box-shadow: inset 0 3px 1px rgba(255,255,255,.45), inset 0 -4px 3px rgba(0,0,0,.12), 0 16px 0 var(--grass-side), 0 18px 0 color-mix(in srgb, var(--grass-side) 70%, black), 0 30px 30px var(--shadow); }
  .tile { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 32%; cursor: pointer; user-select: none; transform-style: preserve-3d; transition: transform .15s;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.1) 0 3px, transparent 3px 9px),
      radial-gradient(110% 100% at 32% 25%, color-mix(in srgb, var(--soil) 72%, white), var(--soil) 50%, color-mix(in srgb, var(--soil) 72%, black));
    box-shadow: inset 0 2px 1px rgba(255,255,255,.3), inset 0 -3px 2px rgba(0,0,0,.2), 0 5px 0 color-mix(in srgb, var(--soil) 58%, black), 0 7px 8px rgba(0,0,0,.25); }
  .tile:hover { transform: translateZ(5px); }
  .tile:active { transform: translateZ(1px); }
  .tile.wet { background:
      radial-gradient(40% 22% at 30% 25%, rgba(255,255,255,.35), transparent 70%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 3px, transparent 3px 9px),
      radial-gradient(110% 100% at 32% 25%, color-mix(in srgb, var(--soil-wet) 75%, white), var(--soil-wet) 50%, color-mix(in srgb, var(--soil-wet) 70%, black));
    box-shadow: inset 0 2px 1px rgba(255,255,255,.3), inset 0 -3px 2px rgba(0,0,0,.25), 0 5px 0 color-mix(in srgb, var(--soil-wet) 58%, black), 0 7px 8px rgba(0,0,0,.25); }
  .tile.locked { cursor: not-allowed; background: radial-gradient(110% 100% at 32% 25%, color-mix(in srgb, var(--grass-side) 75%, white), var(--grass-side) 60%);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.3), 0 4px 0 color-mix(in srgb, var(--grass-side) 60%, black); }
  .tile.locked:hover { transform: none; }
  .tile .lv { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%) translateZ(1px); font-size: 10px; font-weight: 800; color: #fff;
    background: rgba(0,0,0,.28); padding: 0 6px; border-radius: 999px; white-space: nowrap; }
  .tile.struct { background: radial-gradient(110% 100% at 32% 25%, #e3e6ee, #b8bfcc 55%, #8f97a8);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.6), 0 5px 0 #747c8d, 0 7px 8px rgba(0,0,0,.25); }
  .tile.struct.picked { outline: 3px solid var(--butter); outline-offset: 2px; }
  .tile.spray { animation: spray .6s ease-out; }
  @keyframes spray { 30% { box-shadow: 0 0 0 6px rgba(110,200,240,.55), 0 5px 0 #747c8d; } }
  .tile.ripe { animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: inset 0 2px 1px rgba(255,255,255,.3), 0 5px 0 color-mix(in srgb, var(--soil) 58%, black), 0 0 0 4px color-mix(in srgb, var(--butter) 75%, transparent), 0 0 18px 4px color-mix(in srgb, var(--butter) 70%, transparent); } }

  /* crops stand upright: counter-rotate against the tilted plot */
  .tile .crop { position: absolute; left: 50%; bottom: 16%; width: var(--cw, 100%); transform-origin: 50% 100%;
    transform: translateX(-50%) rotateX(calc(var(--tilt) * -1)); }
  .tile .crop .spr { display: block; width: 100%; height: auto; transform-origin: 50% 92%; }
  .tile .crop .fb { display: block; text-align: center; font-size: calc(min(100vw - 100px, 400px) * .45 / var(--n, 5)); line-height: 1; }
  .tile.ripe .crop .spr { animation: bob 1.6s ease-in-out infinite; }
  .tile.thirsty .crop .spr { animation: droop 1.4s ease-in-out infinite; filter: saturate(.6) brightness(.95); }
  @keyframes bob { 50% { transform: translateY(-4%) scale(1.04, .97); } }
  @keyframes droop { 50% { transform: rotate(-7deg) scaleY(.95); } }
  .tile.gold .crop .spr { filter: sepia(1) saturate(3.2) hue-rotate(-12deg) brightness(1.12) drop-shadow(0 0 6px rgba(255,210,80,.9)); }
  .tile.special { box-shadow: inset 0 2px 1px rgba(255,255,255,.3), 0 5px 0 color-mix(in srgb, var(--soil) 58%, black), 0 0 0 3px var(--gold), 0 7px 8px rgba(0,0,0,.25); }
  .tile .star { position: absolute; right: 6%; top: 4%; font-size: 13px; color: var(--gold); text-shadow: 0 0 4px rgba(255,220,120,.9); transform: translateZ(2px); animation: twinkle 1.8s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .35; } }
  .tile .bar, .tile .water { position: absolute; left: 14%; right: 14%; height: 5px; border-radius: 999px; background: rgba(0,0,0,.25); overflow: hidden; transform: translateZ(1px); }
  .tile .bar { top: 7%; } .tile .water { bottom: 7%; }
  .tile .bar i, .tile .water i { display: block; height: 100%; border-radius: 999px; }
  .tile .bar i { background: var(--butter); } .tile .water i { background: var(--water); }
  .tile.ripe .bar, .tile.ripe .water { opacity: 0; }

  #tractors { position: absolute; inset: 0; pointer-events: none; transform-style: preserve-3d; }
  .tractor { position: absolute; width: calc(100% / var(--n, 5) * 1.05); transform: translate(-50%, -78%) translateZ(4px); transform-style: preserve-3d;
    transition: left .26s linear, top .26s linear; }
  .tractor .spr { display: block; width: 100%; transform-origin: 50% 100%; transform: rotateX(calc(var(--tilt) * -1)) scaleX(var(--flip, 1)); }
  .tractor .fb { font-size: 26px; }

  .tools { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .tools button { padding: 8px 13px; font-weight: 800; font-size: 13px; color: var(--on-color); }
  #waterAll { --c: var(--water); } #harvestAll { --c: var(--butter); } #plantAll { --c: var(--sage); }

  /* tabs and panels */
  .tabs { display: flex; gap: 6px; margin-top: 18px; }
  .tab { --c: var(--panel); flex: 1; min-width: 0; font-weight: 800; font-size: 12.5px; padding: 8px 2px 9px; border-radius: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-soft); }
  .tab.on { color: var(--on-color); transform: translateY(2px); }
  .tab.seeds.on { --c: var(--sage); } .tab.journal.on { --c: var(--butter); } .tab.curio.on { --c: var(--lilac); } .tab.workshop.on { --c: var(--aqua); }
  .tab .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 3px; border-radius: 999px; background: var(--badge); color: #fff; font-size: 11px; line-height: 18px; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .panel { margin-top: 10px; padding: 10px; border-radius: 20px; box-shadow: inset 0 3px 8px var(--shadow); }
  .panel.seeds { background: color-mix(in srgb, var(--sage) 20%, var(--card)); }
  .panel.journal { background: color-mix(in srgb, var(--butter) 18%, var(--card)); }
  .panel.curio { background: color-mix(in srgb, var(--lilac) 20%, var(--card)); }
  .panel.workshop { background: color-mix(in srgb, var(--aqua) 18%, var(--card)); }

  #menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .seed { --c: var(--panel); padding: 6px 4px 8px; text-align: center; min-width: 0; border-radius: 18px; }
  .seed .e { display: block; height: 52px; }
  .seed .e .spr { width: 56px; height: 56px; margin: -4px auto 0; display: block; }
  .seed .e .fb { font-size: 30px; }
  .seed .n { font-size: 13px; font-weight: 800; display: block; font-family: var(--font-display); line-height: 1.2; }
  .seed .c { font-size: 11px; color: var(--ink-soft); display: block; font-variant-numeric: tabular-nums; }
  .seed.sel { --c: var(--butter); color: var(--on-color); }
  .seed.sel .c { color: var(--on-color); opacity: .8; }
  .seed.poor { opacity: .55; }
  .seed.locked { opacity: .6; }
  .seed.locked .e .spr { width: 40px; height: 40px; margin-top: 6px; }

  .curio-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; margin: 2px 2px 10px; font-weight: 800; color: var(--ink-soft); }
  .curio-head button { --c: var(--panel); font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 12px; }
  .offer { --c: var(--panel); display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 6px; margin-bottom: 10px; border-radius: 18px; }
  .offer .e { flex: none; width: 56px; height: 56px; }
  .offer .e .spr { width: 100%; height: 100%; display: block; }
  .offer .e .fb { font-size: 34px; }
  .offer .info { flex: 1; min-width: 0; }
  .offer .n { font-weight: 800; font-size: 15px; font-family: var(--font-display); line-height: 1.2; }
  .offer .d { font-size: 11.5px; line-height: 1.35; color: var(--ink-soft); margin: 2px 0; }
  .offer .m { font-size: 11px; color: var(--ink-soft); }
  .offer .btns { display: flex; flex-direction: column; gap: 6px; }
  .offer button.buy, .offer .btns button { --c: var(--lilac); font-weight: 800; font-size: 12px; padding: 7px 10px; border-radius: 12px; white-space: nowrap; color: var(--on-color); }
  .offer.ws .btns button { --c: var(--aqua); }
  .offer.ws button.place { --c: var(--butter); }
  .offer.ws button.place.on { --c: var(--sage); }
  .offer.ws.locked { opacity: .6; }
  .offer.ws .seg { display: flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 12px; flex-wrap: wrap; }
  .offer.ws .seg button { --c: var(--panel); padding: 3px 8px; font-size: 11px; font-weight: 800; border-radius: 10px; }
  .offer.ws .seg button.on { --c: var(--aqua); color: var(--on-color); }
  .offer.ws .pl { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 6px; }
  .offer.ws select { font-family: inherit; font-weight: 700; font-size: 12px; padding: 4px 6px; border: 0; border-radius: 10px; background: var(--card); color: var(--ink); max-width: 100%; min-width: 0; box-shadow: inset 0 2px 4px var(--shadow); }
  .nextcurio { margin-top: 2px; font-size: 11px; text-align: center; color: var(--ink-soft); }

  /* journal */
  .jhead { font-family: var(--font-display); font-weight: 800; font-size: 18px; margin: 2px 2px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .jhead small { font-family: var(--font-body); font-size: 11px; color: var(--ink-soft); font-weight: 800; }
  .order { --c: var(--panel); padding: 8px 10px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; border-radius: 18px; }
  .order.ready { --c: color-mix(in srgb, var(--butter) 45%, var(--panel)); }
  .order.waiting { --c: var(--card); justify-content: center; font-size: 12px; font-weight: 800; color: var(--ink-soft); min-height: 56px; box-shadow: inset 0 2px 6px var(--shadow); }
  .order .face { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 26px;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--coral) 55%, white), var(--coral)); box-shadow: inset 0 -3px 2px rgba(0,0,0,.15), 0 3px 0 color-mix(in srgb, var(--coral) 60%, black); }
  .order .who { font-weight: 800; font-size: 14px; font-family: var(--font-display); line-height: 1.2; }
  .order .wants { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
  .chip { display: inline-flex; align-items: center; gap: 2px; background: var(--card); border-radius: 999px; padding: 1px 8px 1px 2px; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; box-shadow: inset 0 1px 3px var(--shadow); }
  .chip.done { background: var(--sage); color: var(--on-color); }
  .spr.mini { width: 22px; height: 22px; vertical-align: -6px; }
  .fb.mini { font-size: 14px; }
  .order .rw { font-size: 11.5px; color: var(--ink-soft); display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
  .order .acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .order .give { --c: var(--sage); font-weight: 800; font-size: 12px; padding: 7px 10px; border-radius: 12px; color: var(--on-color); white-space: nowrap; }
  .order .skip { background: transparent; border: 0; color: var(--ink-soft); font-weight: 800; font-size: 11px; cursor: pointer; padding: 2px; text-decoration: underline; }
  .goals { display: grid; gap: 7px; margin-bottom: 14px; }
  .goal { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 14px; background: var(--card); font-size: 12px; box-shadow: inset 0 2px 4px var(--shadow); }
  .goal.ready { background: color-mix(in srgb, var(--butter) 40%, var(--card)); box-shadow: 0 3px 0 color-mix(in srgb, var(--butter) 55%, black); }
  .goal .gi { font-size: 20px; width: 24px; text-align: center; }
  .goal .gt { flex: 1; min-width: 0; color: var(--ink-soft); }
  .goal .gt b { font-size: 13px; color: var(--ink); }
  .goal button { --c: var(--sage); font-weight: 800; font-size: 12px; padding: 6px 10px; border-radius: 10px; color: var(--on-color); }
  .goal .pr { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--ink-soft); }
  .almanac { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .alm { text-align: center; background: var(--card); border-radius: 14px; padding: 3px 2px 4px; min-width: 0; box-shadow: inset 0 2px 4px var(--shadow); }
  .alm .ae { display: block; height: 40px; }
  .alm .ae .spr { width: 42px; height: 42px; display: block; margin: -2px auto 0; }
  .alm .ae .fb { font-size: 22px; }

    d.style.setProperty('--dx', Math.cos(a) * r + 'px'); d.style.setProperty('--dy', (Math.sin(a) * r - 18) + 'px');
    document.body.appendChild(d); setTimeout(() => d.remove(), 720);
  }
}

/* ---------- board ---------- */
const plotEl = document.getElementById('plot');
const msgEl = document.getElementById('msg');
const tiles = [];
for (let i = 0; i < SIZE * SIZE; i++) {
  const t = document.createElement('div');
  t.className = 'tile';
  t.addEventListener('click', e => tapTile(i, e));
  plotEl.appendChild(t);
  tiles.push(t);
}

function nb(i) {
  const r = Math.floor(i / SIZE), c = i % SIZE, out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < state.size && cc >= 0 && cc < state.size) out.push(rr * SIZE + cc);
  }
  return out;
}

// Tiles within Chebyshev distance r (square area), excluding the tile itself.
function around(i, r) {
  const R = Math.floor(i / SIZE), C = i % SIZE, out = [];
  for (let dr = -r; dr <= r; dr++) for (let dc = -r; dc <= r; dc++) {
    if (!dr && !dc) continue;
    const rr = R + dr, cc = C + dc;
    if (rr >= 0 && rr < state.size && cc >= 0 && cc < state.size) out.push(rr * SIZE + cc);
  }
  return out;
}

function say(t) { if (!quiet) msgEl.textContent = t; }
function pop(text, e) {
  if (quiet) return;
  const f = document.createElement('div');
  f.className = 'float'; f.textContent = text;
  f.style.left = (e && e.clientX != null ? e.clientX - 12 : innerWidth / 2) + 'px';
  f.style.top = (e && e.clientY != null ? e.clientY - 20 : innerHeight / 2) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
}

function tapTile(i, e) {
  const p = state.plots[i];
  if (state.structs[i]) { state.active = state.active === i ? null : i; state.placing = null; render(); return; }
  if (state.placing) { placeStruct(i, e); return; }
  if (!p && !tileOpen(i)) { say(`🔒 This plot unlocks at Level ${plotLevel(i)}.`); pop('🔒', e); return; }
  if (!p) {
    if (state.level < UNLOCK[state.selected]) state.selected = 'carrot';
    let s = anySeed(state.selected);
    if (isSpecial(s) && !(state.inv[s.id] > 0)) {
      state.selected = 'carrot'; s = anySeed('carrot');
      say('Out of that special seed. Switched back to carrots.');
    }
    if (isSpecial(s)) {
      state.inv[s.id]--;
      pop(s.emoji, e); say(`Planted ${s.name}. ${s.desc}`);
    } else {
      if (state.coins < s.cost) { say(`Not enough coins for ${s.name} seeds. Try a cheaper one!`); pop('🪙?', e); return; }
      state.coins -= s.cost;
      pop(`-🪙${s.cost}`, e); say(`Planted ${s.name}. It was watered to start.`);
    }
    state.plots[i] = newPlot(s.id);
    if (state.plots[i].gold) { say(`✨ A golden ${s.name} sprouted! It sells for ${GOLD_MULT}×.`); chime([880, 1175]); }
    else chime([392], 0.08, 0.035);
    if (isSpecial(s) && !(state.inv[s.id] > 0)) state.selected = 'carrot';
  } else if (p.growth >= 1) {
    lastUnlock = '';
    harvestCore(i, e);
  } else {
    p.water = WATER_SECONDS; pop('💧', e); say('Splash! Nice and damp.'); chime([660], 0.07, 0.03);
  }
  save(); render();
}

// Harvests one tile, applies its special effect, returns coins earned (including chained harvests).
function harvestCore(i, e, opts = {}) {
  const p = state.plots[i];
  if (!p || p.growth < 1) return 0;
  const s = anySeed(p.seed), ns = nb(i), gold = !!p.gold;
  let val = s.sell, note = '';

  if (gold) { val *= GOLD_MULT; note = ` ✨ Golden ×${GOLD_MULT}!`; }
  if (s.fx === 'lucky' && Math.random() < 0.3) { val *= 3; note = ' Lucky! ×3'; }
  if (s.fx === 'bouquet') { const n = ns.filter(j => state.plots[j]).length; val += 4 * n; if (n) note = ` (${n} neighbors)`; }
  if (s.fx === 'spore') { const n = state.plots.filter(Boolean).length - 1; val += 3 * n; if (n > 0) note = ` (${n} spores)`; }

  val = Math.round(val * levelBonus());

  if (s.fx === 'regrow' && !p.regrown) { p.growth = 0; p.regrown = true; p.water = WATER_SECONDS; note = ' It regrows!'; }
  else state.plots[i] = null;
  state.coins += val; state.harvested++;
  state.stats[s.id] = (state.stats[s.id] || 0) + 1;
  if (gold) state.goldHarvested++;
  const xpGain = xpOf(s);
  const leveled = addXp(xpGain);
  let total = val;

  if (s.fx === 'honey') ns.forEach(j => { const q = state.plots[j]; if (q && q.growth < 1) q.growth = Math.min(1, q.growth + 0.3); });
  if (s.fx === 'sparkle') state.plots.forEach(q => { if (q && q.growth < 1) q.water = WATER_SECONDS; });
  if (s.fx === 'sower') {
    const empty = ns.filter(j => !state.plots[j] && !state.structs[j] && tileOpen(j));
    if (empty.length) {
      const j = empty[Math.floor(Math.random() * empty.length)];
      const choices = SEEDS.filter(x => UNLOCK[x.id] <= state.level);
      const b = choices[Math.floor(Math.random() * choices.length)];
      state.plots[j] = newPlot(b.id);
      note = ` Sowed a ${b.name}!`;
    }
  }
  if (s.fx === 'chain' && !opts.noChain) ns.forEach(j => { total += harvestCore(j, e, { noChain: true }); });

  note += ` +${xpGain} XP`;
  if (leveled) note += ` 🎉 Level ${state.level}!`;
  pop(`+🪙${val}${note}`, e);
  burst(e, s.emoji, gold);
  if (!leveled) chime(gold ? [784, 988, 1319] : [587 + Math.random() * 120, 880], 0.12, 0.045);
  say(`Harvested ${s.name}!${note}${lastUnlock ? ' ' + lastUnlock : ''}`);
  onOrderHarvest(s.id);
  return total;
}

document.getElementById('waterAll').onclick = () => {

document.getElementById('plantAll').onclick = () => {

/* ---------- orders ---------- */
function openTiles() { let n = 0; for (let i = 0; i < SIZE * SIZE; i++) if (tileOpen(i) && !state.structs[i]) n++; return n; }
function makeOrder() {
  const pool = SEEDS.filter(s => UNLOCK[s.id] <= state.level);
  const r = Math.random();
  const kinds = Math.min(pool.length, state.level >= 6 && r < 0.3 ? 3 : state.level >= 2 && r < 0.6 ? 2 : 1);
  const left = pool.slice(), picks = [];
  while (picks.length < kinds) {          // newer crops are a little more popular
    const tot = left.reduce((a, _, k) => a + k + 1, 0);
    let x = Math.random() * tot, k = 0;
    while (k < left.length - 1 && (x -= k + 1) > 0) k++;
    picks.push(left.splice(k, 1)[0]);
  }
  const room = Math.max(4, openTiles());
  const items = picks.map(s => ({ id: s.id, have: 0,
    need: Math.max(2, Math.min(40, Math.round(room * (0.35 + Math.random() * 0.35) * 30 / s.time / Math.sqrt(kinds)))) }));
  const value = items.reduce((a, it) => a + anySeed(it.id).sell * it.need, 0);
  const xp = items.reduce((a, it) => a + XP[it.id] * it.need, 0);
  const curios = SPECIALS.filter(s => UNLOCK[s.id] <= state.level);
  return {
    cust: Math.floor(Math.random() * CUSTOMERS.length), items,
    coins: Math.round(value * 1.5 * levelBonus()) + 10, xp: Math.round(xp * 0.6) + 5,
    seed: state.level >= CURIO_LEVEL && curios.length && Math.random() < 0.3 ? curios[Math.floor(Math.random() * curios.length)].id : null,
  };
}
const orderDone = o => !!(o && o.items && o.items.every(it => it.have >= it.need));
while (state.orders.length < ORDER_SLOTS) state.orders.push(makeOrder());
state.orders.length = ORDER_SLOTS;

// Each harvested crop goes into one basket: the first open order (top to bottom) that still wants it.
function onOrderHarvest(id) {
  for (const o of state.orders) {
    if (!o.items || orderDone(o)) continue;
    const it = o.items.find(x => x.id === id && x.have < x.need);
    if (!it) continue;
    it.have++;
    if (orderDone(o)) { say(`📋 ${CUSTOMERS[o.cust][1]}'s order is ready! Deliver it in the Journal.`); chime([659, 784, 988], 0.16); }
    return;
  }
}
function orderTick(dt) {
  state.orders.forEach((o, k) => {
    if (o.items) return;
    o.wait -= dt;
    if (o.wait <= 0) state.orders[k] = makeOrder();
  });
}
function deliverOrder(k, e) {
  const o = state.orders[k];
  if (!orderDone(o)) return;
  state.coins += o.coins;
  lastUnlock = '';
  const leveled = addXp(o.xp);
  if (o.seed) state.inv[o.seed] = (state.inv[o.seed] || 0) + 1;
  state.ordersDone++;
  state.orders[k] = { wait: ORDER_WAIT };
  const [, name] = CUSTOMERS[o.cust];
  pop(`+🪙${o.coins} +${o.xp} XP`, e);
  burst(e, '🪙', true);
  if (!leveled) chime([523, 659, 784, 1047], 0.18);
  say(`${name} paid 🪙${o.coins}${o.seed ? ` and tipped a ${anySeed(o.seed).name} seed` : ''}. Thank you!${lastUnlock ? ' ' + lastUnlock : ''}`);
  save(); render();
}

/* ---------- workshop & automation ---------- */
const ownedStructs = id => (state.sInv[id] || 0) + state.structs.filter(x => x && x.type === id).length;
const structCost = id => Math.round(STRUCTS[id].cost * Math.pow(1.35, ownedStructs(id)));
const tractorCost = () => Math.round(TRACTOR.cost * Math.pow(1.35, state.tractors));
const planterCost = () => Math.round(PLANTER.cost * Math.pow(1.35, state.planters.length));
const expandCost = () => EXPAND[state.size + 1];   // undefined once fully grown

// Screen position of a tile, so harvest pop-ups appear where the tractor is.
function tileEvt(i) {
  if (quiet) return null;
  const r = tiles[i].getBoundingClientRect();
  return { clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 };
}

function placeStruct(i, e) {
  const id = state.placing, d = STRUCTS[id];
  if (!d || !(state.sInv[id] > 0)) { state.placing = null; render(); return; }
  if (state.plots[i]) { say('That tile has a plant on it. Pick an empty tile.'); return; }
  if (!tileOpen(i)) { say(`🔒 This plot unlocks at Level ${plotLevel(i)}.`); pop('🔒', e); return; }
  state.sInv[id]--;
  state.structs[i] = { type: id, cd: 0 };
  pop(d.emoji, e); say(`Placed ${d.name}.`);
  if (!(state.sInv[id] > 0)) state.placing = null;
  save(); render();
}

function structTick(dt) {
  state.structs.forEach((st, i) => {
    if (!st) return;
    const d = STRUCTS[st.type];
    st.cd = (st.cd || 0) - dt;
    if (st.cd > 0) return;
    st.cd = d.every;
    let n = 0;
    around(i, d.radius).forEach(j => {
      const q = state.plots[j];
      if (q && q.growth < 1 && q.water < WATER_SECONDS - 1) { q.water = WATER_SECONDS; n++; }
    });
    if (n && !quiet) st.flashUntil = Date.now() + 600;
  });
}

function emptyTiles() {
  const out = [];
  for (let i = 0; i < state.plots.length; i++) if (inGrid(i) && !state.plots[i] && !state.structs[i] && tileOpen(i)) out.push(i);
  return out;
}

function plantOptions(cur) {
  const list = SEEDS.filter(x => state.level >= UNLOCK[x.id]).concat(SPECIALS.filter(x => state.inv[x.id] > 0));
  if (cur && !list.some(x => x.id === cur) && anySeed(cur)) list.push(anySeed(cur));
  return list;
}

// Each planter drops its seed into a random empty tile anywhere in the garden.
function planterTick(dt) {
  state.planters.forEach(pl => {
    pl.cd = (pl.cd || 0) - dt;
    if (pl.cd > 0) return;
    pl.cd = PLANTER.every;
    const s = anySeed(pl.seed);                       // 'off' has no seed and does nothing
    if (!s || (!isSpecial(s) && state.level < UNLOCK[s.id])) return;
    const spots = emptyTiles();
    if (!spots.length) return;
    if (isSpecial(s)) { if (!(state.inv[s.id] > 0)) return; state.inv[s.id]--; }
    else { if (state.coins < s.cost) return; state.coins -= s.cost; }
    state.plots[spots[Math.floor(Math.random() * spots.length)]] = newPlot(s.id);
  });
}

// Snake route over the garden: row by row ('h') or column by column ('v').
function tractorPath() {
  const n = state.size, out = [];
  for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) {
    const k = a % 2 ? n - 1 - b : b;
    out.push(state.tdir === 'v' ? k * SIZE + a : a * SIZE + k);
  }
  return out;
}
// Tractors sweep the route forward then back (ping-pong), so they never jump across the board.
function stepCell(path, k) {
  const P = path.length, L = 2 * (P - 1), m = ((k % L) + L) % L;
  return path[m <= P - 1 ? m : L - m];
}
function tractorTick(dt) {
  const n = state.tractors;
  if (!n) return;
  const path = tractorPath(), L = Math.max(1, 2 * (path.length - 1));
  const old = state.tpos;
  state.tpos += dt * TRACTOR.speed;
  for (let t = 0; t < n; t++) {
    const off = t * L / n, a = Math.floor(old + off), b = Math.floor(state.tpos + off);
    for (let k = a + 1; k <= b; k++) {
      const i = stepCell(path, k), q = state.plots[i];
      if (q && q.growth >= 1) { if (!quiet) lastUnlock = ''; harvestCore(i, tileEvt(i)); }
    }
  }
  if (state.tpos >= L) state.tpos -= L * Math.floor(state.tpos / L);
}

const trEl = document.createElement('div');
trEl.id = 'tractors';
plotEl.appendChild(trEl);
function renderTractors() {
  const n = state.tractors;
  while (trEl.children.length < n) { const d = document.createElement('div'); d.className = 'tractor'; d.innerHTML = art('tractor'); trEl.appendChild(d); }
  while (trEl.children.length > n) trEl.lastChild.remove();
  if (!n) return;
  const path = tractorPath(), L = Math.max(1, 2 * (path.length - 1));
  const center = i => { const t = tiles[i]; return [t.offsetLeft + t.offsetWidth / 2, t.offsetTop + t.offsetHeight / 2]; };
  Array.from(trEl.children).forEach((el, t) => {
    const sp = (((state.tpos + t * L / n) % L) + L) % L, k = Math.floor(sp), f = sp - k;
    const [x0, y0] = center(stepCell(path, k)), [x1, y1] = center(stepCell(path, k + 1));
    el.style.left = (x0 + (x1 - x0) * f) + 'px';
    el.style.top = (y0 + (y1 - y0) * f) + 'px';
    if (Math.abs(x1 - x0) > 1) el.style.setProperty('--flip', x1 < x0 ? -1 : 1);
  });
}

const barEl = document.getElementById('structBar');

}

const wsEl = document.getElementById('panel-workshop');
let wsKey = '';
function renderWorkshop() {

      `</select></div>`).join('')}</div>
    <div class="btns"><button class="clay" data-wplanter ${pLocked || pMax || state.coins < pc ? 'disabled' : ''}>${pMax ? 'Max' : 'Buy 🪙' + pc}</button></div></div>`;

  const next = state.size + 1;

    ? `<div class="offer clay ws"><div class="e">${art('land')}</div><div class="info"><div class="n">Expand garden to ${next}×${next}</div>

const setHtml = (el, h) => { if (el._h !== h) { el._h = h; el.innerHTML = h; } };

  tiles.forEach((t, i) => {
    const show = inGrid(i);

    if (!show) return;
    const p = state.plots[i], st = state.structs[i], cls = ['tile'];
    let sig = 'e', html = '', title = '';
    if (st) {
      const d = STRUCTS[st.type];
      cls.push('struct');
      if (state.active === i) cls.push('picked');
      if (st.flashUntil && Date.now() < st.flashUntil) cls.push('spray');
      title = `${d.name}: ${d.desc}`; sig = 's' + st.type;
      html = `<div class="crop" style="--cw:${st.type === 'mega' ? 112 : 96}%">${art(st.type)}</div>`;
    } else if (!p && !tileOpen(i)) {
      cls.push('locked'); title = `Unlocks at Level ${plotLevel(i)}`; sig = 'L' + plotLevel(i);
      html = `<div class="crop" style="--cw:54%">${art('lock')}</div><span class="lv">Lv ${plotLevel(i)}</span>`;
    } else if (p) {
      const s = anySeed(p.seed), ripe = p.growth >= 1, wet = p.water > 0, stage = ripe ? s.id : p.growth < 0.33 ? 'sprout' : 'young';
      if (wet && !ripe) cls.push('wet');
      if (ripe) cls.push('ripe');
      if (p.gold) { cls.push('gold'); title = `Golden ${s.name}: sells for ${GOLD_MULT}×`; }
      if (isSpecial(s)) { cls.push('special'); title = `${s.name}: ${s.desc}`; }
      if (!wet && !ripe && s.fx !== 'hardy') cls.push('thirsty');
      sig = 'p' + stage + (p.gold ? 'g' : '') + (isSpecial(s) ? 's' : '');
      html = `<div class="bar"><i></i></div><div class="crop" style="--cw:${ripe ? 108 : stage === 'sprout' ? 72 : 90}%">${art(stage)}</div>` +
        (p.gold || isSpecial(s) ? '<span class="star">✦</span>' : '') + '<div class="water"><i></i></div>';
    }
    const c = cls.join(' ');

    if (t._sig !== sig) { t._sig = sig; t.innerHTML = html; t._bar = t.querySelector('.bar i'); t._water = t.querySelector('.water i'); }
    if (p && !st && t._bar) {
      t._bar.style.width = Math.min(1, p.growth) * 100 + '%';
      t._water.style.width = (p.growth >= 1 ? 0 : Math.max(0, Math.min(1, p.water / WATER_SECONDS))) * 100 + '%';
    }
  });
  renderTractors();
}

function tick(dt) {
  // Rain aura first, so lilies and their neighbors count as damp this tick.
  state.plots.forEach((p, i) => {
    if (p && p.growth < 1 && fxOf(p) === 'rain') {
      p.water = Math.max(p.water, 3);
      nb(i).forEach(j => { const q = state.plots[j]; if (q && q.growth < 1) q.water = Math.max(q.water, 3); });
    }
  });
  state.plots.forEach((p, i) => {
    if (!p || p.growth >= 1) return;
    const s = anySeed(p.seed);
    if (raining || p.water > 0) {
      if (!raining) {
        const mulched = nb(i).some(j => state.plots[j] && fxOf(state.plots[j]) === 'mulch');
        p.water = Math.max(0, p.water - dt * (mulched ? 0.5 : 1));
      }
      p.growth = Math.min(1, p.growth + dt * (s.fx === 'fast' ? 2 : 1) * (raining ? 0.5 : 1) / s.time);   // rain grows at half speed
    } else if (s.fx === 'hardy') {
      p.growth = Math.min(1, p.growth + dt * 0.5 / s.time);
    }
  });
  structTick(dt);
  planterTick(dt);
  tractorTick(dt);
}

// Fast-forwards time away. A soft rain keeps every plant growing; ripe crops wait (or get harvested by tractors).
function catchUp(sec) {
  sec = Math.min(sec, MAX_AWAY);
  const before = { coins: state.coins, harvested: state.harvested, level: state.level, orders: state.orders.filter(orderDone).length };
  quiet = true; raining = true; lastUnlock = '';
  const step = sec > 1800 ? 2 : 1;
  for (let left = sec; left > 0; left -= step) { const d = Math.min(step, left); tick(d); orderTick(d); }
  quiet = false; raining = false;
  state.plots.forEach(p => { if (p && p.growth < 1) p.water = Math.max(p.water, WATER_SECONDS * 0.5); });
  const r = { sec, coins: state.coins - before.coins, harvested: state.harvested - before.harvested,
    levels: state.level - before.level, ripe: state.plots.filter(p => p && p.growth >= 1).length,
    orders: state.orders.filter(orderDone).length - before.orders, unlock: lastUnlock };
  lastUnlock = '';
  if (Date.now() >= state.shop.next) rollShop();
  return r;
}

function fmtDur(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return h ? `${h}h ${m}m` : m ? `${m} min` : `${Math.round(sec)}s`;
}
const modalEl = document.getElementById('modal');
function showModal(html, btn) {

  ok.onclick = () => { modalEl.hidden = true; modalEl.innerHTML = ''; chime([523, 659], 0.1); };
  try { ok.focus(); } catch (e) {}
}
function showWelcome(r, daily) {
  const li = [];
  if (r) {
    li.push(`🌧️ A soft rain watered the garden for ${fmtDur(r.sec)}${r.sec >= MAX_AWAY ? ' (the most it can do)' : ''}.`);
    if (r.harvested > 0) li.push(`🚜 Your machines harvested ${r.harvested.toLocaleString()} crops. Net coins: ${r.coins >= 0 ? '+' : '−'}🪙${Math.abs(r.coins).toLocaleString()}.`);
    if (r.ripe > 0) li.push(`🧺 ${r.ripe} crop${r.ripe > 1 ? 's are' : ' is'} ripe and waiting for you.`);
    if (r.orders > 0) li.push(`📋 ${r.orders} order${r.orders > 1 ? 's are' : ' is'} ready to deliver.`);
    if (r.levels > 0) li.push(`🎉 You reached Level ${state.level}!${r.unlock ? ' ' + r.unlock : ''}`);
  }
  if (daily) li.push(`🎁 Daily gift: 🪙${daily.gift}${daily.seed ? ` and a ${anySeed(daily.seed).emoji} ${anySeed(daily.seed).name} seed` : ''}. 🔥 ${daily.streak}-day streak${daily.streak < 3 ? '. Come back tomorrow to grow it' : ''}.`);
  showModal(`<div class="big">${art('sunflower')}</div><h2>Welcome back</h2><ul>${li.map(x => `<li>${x}</li>`).join('')}</ul>`, 'Into the garden');
}
function showIntro() {
  showModal(`<div class="big">${art('young')}</div><h2>Welcome to Cozy Garden</h2><ul>
    <li>🥕 Pick a seed and tap soil to plant. Tap a glowing plant to harvest.</li>
    <li>💧 Plants grow while their soil is damp. Tap to water.</li>
    <li>📋 Customers post orders in the Journal. Fill them for big rewards.</li>
    <li>✨ Now and then a crop comes up golden and sells for ${GOLD_MULT}×.</li>
    <li>🌧️ Close the page any time. Rain keeps your garden growing for up to 8 hours, and a gift waits each day.</li>
  </ul>`, 'Start planting');
}

function dayKey(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function dailyCheck() {
  const now = new Date(), today = dayKey(now);
  if (state.lastDay === today) return null;
  const y = new Date(now); y.setDate(y.getDate() - 1);
  state.streak = state.lastDay === dayKey(y) ? (state.streak || 0) + 1 : 1;
  state.bestStreak = Math.max(state.bestStreak || 0, state.streak);
  state.lastDay = today;
  if (fresh) return null;
  const gift = Math.round((20 + 10 * Math.min(state.streak, 7)) * (1 + 0.15 * (state.level - 1)));
  state.coins += gift;
  let seed = null;
  const curios = SPECIALS.filter(s => UNLOCK[s.id] <= state.level);
  if (state.streak % 3 === 0 && state.level >= CURIO_LEVEL && curios.length) {
    seed = curios[Math.floor(Math.random() * curios.length)].id;
    state.inv[seed] = (state.inv[seed] || 0) + 1;
  }
  return { gift, streak: state.streak, seed };
}

/* ---------- boot ---------- */
document.querySelectorAll('[data-art]').forEach(el => { el.innerHTML = art(el.dataset.art); });
let awayReport = null;
if (!fresh && !hotData && state.lastSeen) {
  const away = (Date.now() - state.lastSeen) / 1000;
  if (away > 20) awayReport = catchUp(away);
}
const daily = hotData ? null : dailyCheck();
checkGoals();
if (fresh) showIntro();
else if (daily || (awayReport && awayReport.sec > 60)) showWelcome(awayReport && awayReport.sec > 60 ? awayReport : null, daily);
else if (awayReport && awayReport.ripe) say(`Welcome back! ${awayReport.ripe} crop${awayReport.ripe > 1 ? 's are' : ' is'} ready to harvest.`);
save();

let lastWall = Date.now(), saveTimer = 0;
setInterval(() => {
  if (wiping) return;
  const now = Date.now(), dt = Math.max(0, (now - lastWall) / 1000); lastWall = now;
  if (dt > 5) {
    const r = catchUp(dt);
    if (dt > 60 && modalEl.hidden) showWelcome(r, null);
  } else { tick(dt); orderTick(dt); }
  if (Date.now() >= state.shop.next) rollShop('New wares at the Curio Shop! ✨');
  // gentle safety net: a neighbor leaves coins if you're totally stuck
  if (!state.plots.some(Boolean) && state.coins < 2) { state.coins += 5; say('A neighbor dropped off a few coins for seeds. 💛'); }
  checkGoals();
  saveTimer += dt; if (saveTimer > 5) { save(); saveTimer = 0; }
  render();
}, 250);
addEventListener('pagehide', () => { if (!wiping) save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && !wiping) save(); });

render();
</script>
</body>
</html>
