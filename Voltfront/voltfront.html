  if (B.shake>0.2 && !reduceMotion){ ctx.translate((Math.random()-.5)*B.shake,(Math.random()-.5)*B.shake); }
  B.shake*=0.86;
  drawBoard(now);
  if (B.alert==='bleed'){ ctx.fillStyle=`rgba(199,139,255,${0.05+0.03*Math.sin(now/300)})`; ctx.fillRect(0,0,BW,BH); }
  else if (B.alert==='overload'){ ctx.fillStyle=`rgba(255,210,94,${0.03+0.02*Math.sin(now/300)})`; ctx.fillRect(0,0,BW,BH); }
  for (const id in B.tele){ const T=B.tele[id]; const a=Math.min(1,(now-T.t0)/180); drawTelegraph(B.disp[id].team,T.from,T.action,a,'tiles'); }
  // units
  for (const id in B.disp){
    const d=B.disp[id];
    if (d.anim){ const p=Math.max(0,now-d.anim.t0)/d.anim.dur; const pos=lerpPath(d.anim.path,p); d.px=pos[0]; d.py=pos[1]; if (p>=1){ const l=d.anim.path[d.anim.path.length-1]; d.px=l[0]; d.py=l[1]; d.anim=null; } }
    let alpha=1; if (!d.alive){ const k=(now-d.dieAt)/500; if (k>=1) continue; alpha=1-k; }
    let [cx,cy]=[d.px*TS+TS/2, d.py*TS+TS/2];
    if (d.bump){ const k=(now-d.bump.t0)/d.bump.dur; if (k>=1) d.bump=null; else { const o=Math.sin(k*Math.PI)*TS*0.18; cx+=d.bump.dir[0]*o; cy+=d.bump.dir[1]*o; } }
    const bob=reduceMotion?0:Math.sin(t*2+d.bob)*TS*0.012;
    if (d.shield>0){ ctx.strokeStyle=`rgba(143,199,255,${0.45+0.2*Math.sin(t*4)})`; ctx.lineWidth=1.5; ctx.beginPath(); for (let i=0;i<6;i++){ const a=i*Math.PI/3+Math.PI/6; const r=TS*0.43; i?ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);} ctx.closePath(); ctx.stroke(); }
    if (d.energy>=d.maxE && d.alive){ const g=ctx.createRadialGradient(cx,cy,TS*0.1,cx,cy,TS*0.5); g.addColorStop(0,`rgba(${TEAMC[d.team].soft},.25)`); g.addColorStop(1,`rgba(${TEAMC[d.team].soft},0)`); ctx.fillStyle=g; ctx.fillRect(cx-TS/2,cy-TS/2,TS,TS); }
    drawMech(ctx,d.type,cx,cy+bob,TS*0.8*(d.alive?1:1+(1-alpha)*0.2),d.team,t,alpha);
    if (d.flash>0){ ctx.fillStyle=`rgba(255,255,255,${d.flash*0.55})`; ctx.beginPath(); ctx.arc(cx,cy,TS*0.32,0,Math.PI*2); ctx.fill(); d.flash=Math.max(0,d.flash-0.08); }
    if (d.alive) drawUnitHud(cx,cy,d.team,d.hp,d.maxHp,d.shield,d.energy,d.maxE);
  }
  for (const id in B.tele){ const T=B.tele[id]; const a=Math.min(1,(now-T.t0)/180); drawTelegraph(B.disp[id].team,T.from,T.action,a,'marks'); }
  drawFx(now);
  // floats

  for (const f of B.floats){ const k=Math.max(0,now-f.t0)/(f.life*Math.max(0.35,1/Math.sqrt(B.speed))); const fs=Math.max(12,TS*0.3);
    ctx.font=`700 ${fs}px "Tektur",sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.globalAlpha=1-k*k;
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.85)'; const x=f.x*TS+TS/2, y=f.y*TS+TS*0.2-k*TS*0.5; ctx.strokeText(f.text,x,y); ctx.fillStyle=f.color; ctx.fillText(f.text,x,y); ctx.globalAlpha=1; }
  ctx.restore();
  // banner
  if (B.banner){ const k=Math.max(0,now-B.banner.t0)/(B.banner.life/Math.min(B.speed,3)); if (k>=1) B.banner=null; else {
    const a=k<0.15?k/0.15:k>0.75?(1-k)/0.25:1; const fs=B.banner.small?TS*0.42:TS*(B.banner.warn?0.36:0.58);
    ctx.globalAlpha=a; ctx.fillStyle='rgba(5,9,10,.78)'; ctx.fillRect(0,BH/2-fs,BW,fs*2);
    ctx.fillStyle=B.banner.warn?(B.alert==='bleed'?'#c78bff':'#ffd25e'):B.banner.small?'#ff9b7a':'#e6dec7';
    ctx.font=`900 ${fs}px "Tektur",sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(B.banner.text,BW/2,BH/2+1); ctx.globalAlpha=1; } }
}
function drawFx(now){
  const B=G.battle;
  B.fx=B.fx.filter(f=>now-f.t0<f.life/Math.min(B.speed,3));
  for (const f of B.fx){
    const k=Math.max(0,(now-f.t0)/(f.life/Math.min(B.speed,3))); const C=TEAMC[f.team]; const [fx,fy]=f.from?tc(f.from[0],f.from[1]):[0,0]; const [tx,ty]=f.to?tc(f.to[0],f.to[1]):[0,0];
    ctx.save(); ctx.shadowColor=C.glow; ctx.shadowBlur=12;
    switch(f.kind){
      case 'slash': { ctx.strokeStyle=`rgba(255,255,255,${1-k})`; ctx.lineWidth=3; for (let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(tx,ty,TS*(0.25+i*0.08),-2.3+k*1.8+i*.2,-1.0+k*1.8+i*.2); ctx.stroke(); } break; }
      case 'bolt': { const p=Math.min(1,k*1.6); const x=fx+(tx-fx)*p, y=fy+(ty-fy)*p; ctx.fillStyle=C.glow; ctx.beginPath(); ctx.arc(x,y,TS*0.08,0,Math.PI*2); ctx.fill(); if (p>=1){ ctx.globalAlpha=1-k; ctx.beginPath(); ctx.arc(tx,ty,TS*0.3*k,0,Math.PI*2); ctx.stroke(); } break; }
      case 'shell': { const p=Math.min(1,k*1.4); const x=fx+(tx-fx)*p, y=fy+(ty-fy)*p-Math.sin(p*Math.PI)*TS*1.4; ctx.fillStyle=C.glow; ctx.beginPath(); ctx.arc(x,y,TS*0.09,0,Math.PI*2); ctx.fill();
        if (p>=1){ const e=(k-1/1.4)/(1-1/1.4); ctx.globalAlpha=1-e; ctx.fillStyle=`rgba(${C.soft},.5)`; ctx.beginPath(); ctx.arc(tx,ty,TS*(f.big?1.1:0.5)*(0.4+e),0,Math.PI*2); ctx.fill(); } break; }
      case 'beam': case 'hook': { ctx.globalAlpha=1-k; ctx.strokeStyle=f.kind==='hook'?'#e6dec7':C.glow; ctx.lineWidth=f.kind==='hook'?2.5:TS*0.12*(1-k)+1; if (f.kind==='hook') ctx.setLineDash([5,3]); ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(tx,ty); ctx.stroke(); ctx.setLineDash([]); ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(tx,ty); ctx.stroke(); break; }
      case 'zap': { ctx.globalAlpha=1-k; ctx.strokeStyle=C.glow; ctx.lineWidth=2.5; const pts=[f.from,...(f.chain&&f.chain.length?f.chain:[f.to])];
        ctx.beginPath(); for (let i=0;i<pts.length-1;i++){ const [ax,ay]=tc(pts[i][0],pts[i][1]), [bx,by]=tc(pts[i+1][0],pts[i+1][1]); if (i===0) ctx.moveTo(ax,ay); for (let s=1;s<=5;s++){ const q=s/5; ctx.lineTo(ax+(bx-ax)*q+(s<5?(Math.random()-.5)*TS*0.25:0), ay+(by-ay)*q+(s<5?(Math.random()-.5)*TS*0.25:0)); } } ctx.stroke(); break; }
      case 'shield': { ctx.globalAlpha=1-k; ctx.strokeStyle='#8fc7ff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(fx,fy,TS*(0.3+k*1.0),0,Math.PI*2); ctx.stroke(); break; }
      case 'link': { ctx.globalAlpha=1-k; ctx.strokeStyle='#ffd25e'; ctx.lineWidth=3; for (const l of (f.links||[])){ const [lx,ly]=tc(l[0],l[1]); ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(lx,ly); ctx.stroke(); ctx.beginPath(); ctx.arc(lx,ly,TS*0.35*k+4,0,Math.PI*2); ctx.stroke(); } break; }
      case 'ring': { ctx.globalAlpha=1-k; ctx.strokeStyle=C.glow; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(fx,fy,TS*(f.radius+0.4)*k,0,Math.PI*2); ctx.stroke(); break; }
      case 'heal': { ctx.globalAlpha=1-k; ctx.fillStyle='#9ef0c0'; ctx.shadowColor='#9ef0c0'; const s=TS*0.12; ctx.fillRect(tx-s/2,ty-s*1.5-k*TS*0.4,s,s*3); ctx.fillRect(tx-s*1.5,ty-s/2-k*TS*0.4,s*3,s); break; }
      case 'quake': { ctx.globalAlpha=1-k; ctx.strokeStyle=C.glow; ctx.lineWidth=5*(1-k)+1; ctx.strokeRect(fx-TS*(0.5+k),fy-TS*(0.5+k),TS*(1+2*k),TS*(1+2*k)); break; }
      case 'blink': { const [bx,by]=tc(f.at[0],f.at[1]); ctx.globalAlpha=1-k; ctx.strokeStyle=C.glow; ctx.lineWidth=2; for (let i=0;i<6;i++){ const a=i*Math.PI/3; ctx.beginPath(); ctx.moveTo(bx+Math.cos(a)*TS*0.1,by+Math.sin(a)*TS*0.1); ctx.lineTo(bx+Math.cos(a)*TS*(0.2+k*0.4),by+Math.sin(a)*TS*(0.2+k*0.4)); ctx.stroke(); } break; }
      case 'boom': { ctx.globalAlpha=1-k; ctx.fillStyle=C.glow; for (const p of f.parts){ const r=p.v*k*TS*0.7; ctx.fillRect(fx+Math.cos(p.a)*r-p.s/2,fy+Math.sin(p.a)*r-p.s/2,p.s,p.s); } ctx.fillStyle=`rgba(255,240,220,${1-k})`; ctx.beginPath(); ctx.arc(fx,fy,TS*0.4*(1-k),0,Math.PI*2); ctx.fill(); break; }
    }
    ctx.restore();
  }
}

function showResult(w){
  const B=G.battle; if (!B || $('#scr-field').hidden) return;
  if (w==='P') G.record.w++; else if (w==='E') G.record.l++; else G.record.d++;
  Store.save();
  const pAlive=B.st.units.filter(u=>u.team==='P'&&u.alive).length, eDead=B.st.units.filter(u=>u.team==='E'&&!u.alive).length;
  const title=w==='P'?'VICTORY':w==='E'?'DEFEAT':'STALEMATE', col=w==='P'?'var(--cyan)':w==='E'?'var(--rust)':'var(--bone)';
  const line=w==='P'?'The enemy grid has gone dark.':w==='E'?'Your squad is offline. Rework the formation and try again.':'Both reactors failed at once.';
  $('#rbox').innerHTML=`<h2 style="color:${col}">${title}</h2><p>${line}</p>
    <div class="rs"><div><b>${B.st.round}</b><span>Rounds</span></div><div><b>${pAlive}/${G.squad.length}</b><span>Survived</span></div><div><b>${eDead}/${G.enemy.length}</b><span>Destroyed</span></div></div>
    <button class="btn go" id="rRe">Rematch · same enemy</button><button class="btn" id="rNew">New opponent</button><button class="btn" id="rHome">Back to hangar</button>`;
  $('#resultVeil').hidden=false;
  $('#rRe').onclick=()=>{ $('#resultVeil').hidden=true; openField(); };
  $('#rNew').onclick=()=>{ $('#resultVeil').hidden=true; newEnemy(); openField(); };
  $('#rHome').onclick=()=>{ $('#resultVeil').hidden=true; setTab('hangar'); renderHangar(); };
}

// =====================================================================
// LOOP
// =====================================================================
let raf=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (G.mode==='deploy') renderDeploy(now);
  else if (G.battle){ stepBattle(now); renderBattle(now); }
}
function startLoop(){ if (!raf) raf=requestAnimationFrame(frame); }
function stopLoop(){ if (raf) cancelAnimationFrame(raf); raf=0; }

// ---------- boot ----------
function boot(){ buildRoster(); renderHangar(); renderCodex(); renderProtocols(); renderManual(); setTab('hangar'); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if (G.tab==='hangar' && $('#scr-field').hidden){ buildRoster(); renderHangar(); } });
boot();

</script>
